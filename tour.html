<style>

  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, sans-serif; padding: 24px 16px; }

  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: var(--muted); }
  video { display: block; width: 100%; height: auto; aspect-ratio: 1440 / 1012; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
